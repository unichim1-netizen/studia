# CI/CD backend: test -> build image (amd64+arm64) đẩy lên GHCR -> SSH vào EC2 kéo image mới và restart.
# Secrets cần tạo: EC2_HOST, EC2_USER, EC2_SSH_KEY  (xem docs/DEPLOY_EC2.md mục CI/CD).
name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-deploy.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "deploy/ec2/**", ".github/workflows/backend-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # PDFium dựng hình học dòng chữ theo phông hệ thống; không có phông thì bộ tách khối/dựng đề lệch so với máy dev
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation && fc-list | wc -l
      - run: pip install -r requirements-dev.txt
      - name: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=short -rf -p no:cacheprovider > /tmp/pytest.txt 2>&1
          code=$?
          cat /tmp/pytest.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -vE "^\s*$|Warning|warnings" /tmp/pytest.txt | tail -n 60 | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s//%0D/g;s/
/%0A/g')
            echo "::error title=pytest-failed::$msg"
          fi
          exit $code

  build-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/studia-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,API_IMAGE
          script_stop: true
          script: |
            cd ~/studia
            git fetch origin main && git reset --hard origin/main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd deploy/ec2
            echo "API_IMAGE=$API_IMAGE" > .env
            docker compose pull api
            docker compose up -d --remove-orphans
            docker image prune -f
            # chờ healthcheck, fail job nếu bản mới không lên
            for i in $(seq 1 20); do
              s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)")
              [ "$s" = healthy ] && echo "healthy" && exit 0
              sleep 5
            done
            docker compose logs --tail=50 api
            exit 1
